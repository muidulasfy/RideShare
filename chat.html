<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RideNest - Chat</title>

    <link rel="stylesheet"
          href="chat.css">
          <script>
fetch("session_check.php")
.then(response => response.json())
.then(data => {

    if (!data.loggedIn) {
        window.location.href = "login.html";
    }

})
.catch(error => {
    console.log(error);
    window.location.href = "login.html";
});
</script>
<link rel="stylesheet" href="profile_dropdown.css">

</head>


<body>


<div class="navbar">

    <div class="logo">
        RideNest
    </div>


    <div class="menu">

        <a href="main_page.html">
            Home
        </a>

        <a href="find_ride.html">
            Find Ride
        </a>

        <a href="post_ride.html">
            Post Ride
        </a>

        <a href="My Rides.html">
            My Rides
        </a>

        <a href="chat.html"
           class="active">
            Chat
        </a>

        <a href="profile.html">
            Profile
        </a>

    </div>


    <div class="profile-icon">
        S
    </div>

</div>


<div class="chat-container">


    <div class="sidebar">


        <div class="sidebar-header">

            <h2>
                Messages
            </h2>

        </div>


        <div class="search-box">

            <span>⌕</span>

            <input
                type="text"
                id="searchUser"
                placeholder="Search"
            >

        </div>

        <div id="peopleList"
             class="people-list">

        </div>


    </div>


    <div class="conversation">


        <div class="chat-header">

            <div class="chat-user-icon">
                S
            </div>


            <div>

                <h3 id="name">
                    Select a person
                </h3>

                <p id="status">
                    Select someone to start chatting
                </p>

            </div>

        </div>



        <div id="messages"
             class="message-area">

            <div class="empty-chat">

                <div class="empty-icon">
                    💬
                </div>

                <h3>
                    Your messages
                </h3>

                <p>
                    Select a person to start a conversation.
                </p>

            </div>

        </div>



        <div class="send-area">

            <input
                type="text"
                id="text"
                placeholder="Write a message..."
                autocomplete="off"
            >


            <button
                type="button"
                onclick="sendMessage()">

                Send

            </button>

        </div>


    </div>

</div>



<script src="chat.js?v=1000"></script>
<script src="profile_dropdown.js"></script>

</body>

</html>
