<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RideNest - Admin Login</title>

    <link rel="stylesheet"
          href="admin_login.css">

</head>

<body>

<div class="login-box">

    <div class="logo">
        RideNest
    </div>

    <h1>Admin Login</h1>

    <p>
        Login to manage the RideNest system.
    </p>

    <form action="admin_login.php" method="POST">

        <input
            type="email"
            name="email"
            placeholder="Admin Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>

</html>
