<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RideNest - Forgot Password</title>

    <link
        rel="stylesheet"
        href="forgot_password.css"
    >

</head>


<body>


<div class="page">


    <div class="box">


        <div class="logo">
            RideNest
        </div>


        <h1>
            Reset Password
        </h1>


        <p class="subtitle">
            Enter your registered email and create a new password.
        </p>


        <!-- EMAIL -->

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
        >


        <!-- NEW PASSWORD -->

        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
        >


        <!-- CONFIRM PASSWORD -->

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
        >


        <button
            type="button"
            id="resetButton"
        >
            Reset Password
        </button>


        <div class="back-login">

            <a href="login.html">
                Back to Login
            </a>

        </div>


    </div>


</div>


<script src="forgot_password.js"></script>


</body>

</html>
