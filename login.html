<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - RideNest</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="full-screen">

        <!-- ================= NAVBAR ================= -->

        <header class="navbar">

            <div class="title">
                RideNest
            </div>

            <nav class="tabs">
                <div class="tab">Home</div>
                <div class="tab">Find Ride</div>
                <div class="tab">Post Ride</div>
                <div class="tab">My Rides</div>
                <div class="tab">Chat</div>
                <div class="tab">Profile</div>
            </nav>

            <div class="auth-buttons">

                <button class="login-button">
                    Login
                </button>

                <button
                    class="signup-button"
                    onclick="window.location.href='registration.html'">
                    Sign up
                </button>

            </div>

        </header>


        <!-- ================= MAIN ================= -->

        <main class="main-body">

            <div class="item">

                <h2>Welcome back</h2>

                <p>
                    Log in to continue your campus journey.
                </p>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="input-field"
                        placeholder="Enter your university email"
                        autocomplete="email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="input-field"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- FORGOT PASSWORD -->
<div class="title3">
    <a href="forgot_password.html">Forgot password?</a>
</div>


                <!-- LOGIN -->

                <button
                    type="button"
                    class="Login"
                    id="loginButton">

                    Login

                </button>


                <!-- REGISTER -->

                <div class="register-text">

                    Don't have an account?
                    
                    <a href="registration.html">
                        Register here
                    </a>

                </div>


                <div class="security-text">
                    Secure campus access • RideNest
                </div>

            </div>

        </main>

    </div>


    <!-- DO NOT CHANGE LOGIN JS -->

    <script src="login.js?v=2"></script>

</body>

</html>
